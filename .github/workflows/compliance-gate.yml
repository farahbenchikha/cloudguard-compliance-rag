name: "DevSecOps AI Compliance Quality Gate"

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "**.tf"
  push:
    branches: [ "main", "master" ]

jobs:
  compliance-audit:
    name: "CIS Benchmark Security Audit"
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Run Ingestion of CIS Security Benchmarks into Qdrant"
        run: |
          python src/ingestion/ingest_benchmark.py

      - name: "Execute DevSecOps AI Quality Gate"
        run: |
          python src/cli/audit_gate.py --path data/test_iac/terragoat/terraform/aws/s3.tf --fail-on-critical
